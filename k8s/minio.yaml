# 1. The Storage Claim (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: nexis
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi # Allocating 2GB for file storage
---
# 2. The Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexis-minio
  namespace: nexis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        # Using the exact image version from your Docker Compose
        image: minio/minio:RELEASE.2025-06-13T11-33-47Z
        args:
        - server
        - /data
        - --console-address
        - ":9001"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: minio.access.key
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: nexis-secrets
              key: minio.secret.key
        volumeMounts:
        - name: minio-storage
          mountPath: /data
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc
---
# 3. The Service
apiVersion: v1
kind: Service
metadata:
  name: nexis-minio-service
  namespace: nexis
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
